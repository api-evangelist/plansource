        '200':
          description: Administrator create response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorModel'
              examples:
                response:
                  value:
                    status: success
                    errors: []
                    data:
                      links:
                        href: /admin/administrator/9956
                        rel: self
                    id: 9956
                    first_name: Tom
                    last_name: Leonardo
                    user_name: tleon_1
                    email: tleon101@email.com
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 400
                      message: Organization(s) with code(s) 652 not found.
                      error_code: 400
                    data: []
        '401':
          description: Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Error'
              examples:
                response:
                  value:
                    status: failure
