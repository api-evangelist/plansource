components:
  schemas:
    NoLinks500Error:
      title: Error
      required:
      - error_code
      - http_status
      - message
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    body_10:
      title: body
      required:
      - organization_codes
      - roles
      type: object
      properties:
        user:
          $ref: '#/components/schemas/administratoriddisable_user'
        roles:
          type: array
          description: List of role lookup_codes available to the logged_in API user.
          items:
            type: string
        organization_codes:
          type: array
          description: List of one or more organization codes the administrator has access or belongs to.
          items:
            type: string
        user_type:
          type: string
          description: The administrator user type - organization administrator or master administrator.
          enum:
          - org_admin
          - master_admin
    403Error:
      title: Error
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    AdministratorDisable:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: string
    AdminExtendedModel:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: array
          items: {}
        links:
          type: array
          items: {}
        href:
          type: string
        rel:
          type: string
        id:
          type: integer
        type:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        user_id:
          type: integer
        phone:
          type: string
        master_org_id:
          type: integer
        organization_id:
          type: integer
        is_agent:
          type: boolean
        carrier_id:
          type: integer
        general_agency_id:
          type: integer
        fax:
          type: string
        tax_id:
          type: integer
        is_primary_administrator:
          type: boolean
        is_data_discrepancy_contact:
          type: boolean
        receive_system_downtime_notifications:
          type: boolean
        receive_system_release_notes:
          type: boolean
        receive_renewal_notifications:
          type: boolean
        receive_ticket_notifications:
          type: boolean
        account_initialized:
          type: boolean
        populations:
          type: array
          items: {}
        name:
          type: string
        roles:
          type: array
          items: {}
        user_name:
          type: string
        email:
          type: string
        email2:
          type: string
        cell:
          type: string
        disabled_on:
          type: string
    404Error:
      title: Error
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
    401Error:
      title: Error
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    400Error:
      title: Error
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    AdministratorModel:
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        data:
          type: array
          items: {}
        links:
          type: array
          items: {}
        href:
          type: string
        rel:
          type: string
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
    administratoriddisable_user:
      required:
      - user_name
      type: object
      properties:
        user_name:
          type: string
  requestBodies:
    Body3:
      content:
        application/json:
          schema:
            title: body
            required:
            - far_lookup_code
            - organization_codes
            - roles
            - user_type
            type: object
            properties:
              user:
                required:
                - user_name
                type: object
                properties:
                  user_name:
                    type: string
                  email:
                    type: string
                  time_zone:
                    type: string
                  override_sso:
                    type: boolean
                    default: false
              administrator:
                type: object
                properties:
                  first_name:
                    type: string
                    description: If included, field cannot be left blank.
                  middle_name:
                    type: string
                  last_name:
                    type: string
                    description: If included, field cannot be left blank.
                  phone:
                    type: string
                  fax:
                    type: string
                  is_agent:
                    type: boolean
                    default: false
                  is_primary_administrator:
                    type: boolean
                    default: false
                  is_data_discrepancy_contact:
                    type: boolean
                    default: false
                  receive_system_downtime_notifications:
                    type: boolean
                    default: false
                  receive_system_release_notes:
                    type: boolean
                    default: false
                  receive_renewal_notifications:
                    type: boolean
                    default: false
                  receive_ticket_notifications:
                    type: boolean
                    default: false
              roles:
                type: array
                description: List of role lookup_codes available to the logged_in API user.
                items:
                  type: string
              organization_codes:
                type: array
                description: List of one or more organization codes the administrator has access or belongs to.
                items:
                  type: string
              org_populations:
                type: array
                description: List of one or mored population lookup_codes is required if creating organization administrator.
                items:
                  type: string
              far_lookup_code:
                type: string
                description: The default value is update_all.
                enum:
                - update_all
                - import
                - read_only
                - subscriber
                - batch_import
              user_type:
                type: string
                description: The administrator user type - organization administrator or master administrator.
                enum:
                - org_admin
                - master_admin
            example:
              user:
                user_name: my_admin_user
                email: test_admin@plansourcetest.com
              administrator:
                first_name: admin
                last_name: user
              roles:
              - Master Administrator
              organization_codes:
              - organzation_code_1
              user_type: org_admin
      required: true
  securitySchemes:
    clientSecretJwt:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.plansource.com/oauth/v2/token
          scopes:
            admin_api_v2: Access to all endpoints
    authString:
      type: apiKey
      name: AuthenticationString
      in: header
    signature:
      type: apiKey
      name: Signature
      in: header
x-readme:
  explorer-enabled: true
  proxy-enabled: true
