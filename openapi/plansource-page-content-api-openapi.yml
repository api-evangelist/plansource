openapi: 3.2.0
info:
  title: Plansource Admin Page Content API
  description: An integration API for Plansource data for administration functions
  contact:
    name: Plansource API team
    email: api-team@plansource.com
  license:
    name: B) 2017 Plansource.  All rights reserved.
  version: 2.0.0
servers:
- url: https://api.plansource.com/admin/v2
security:
- clientSecretJwt:
  - admin_api_v2
- authString: []
  signature: []
tags:
- name: Page Content
  description: Organization page content data.
paths:
  /page_content:
    get:
      tags:
      - Page Content
      description: Returns page content or page contents for the requested view. Blocks are ordered according to their 'slot number' and all fields not set are omitted from the response.
      parameters:
      - name: Accept
        in: header
        description: The format of content that is acceptable as a response.
        required: false
        schema:
          type: string
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: The format of content in the request.
        required: false
        schema:
          type: string
          enum:
          - application/json
      - name: org_page_content_id
        in: query
        description: Unique id for the org page content (NOTE! This parameter IS required when page_content_lookup_code IS NOT provided)
        required: false
        schema:
          type: integer
          format: int32
      - name: page_content_lookup_code
        in: query
        description: Page content lookup code (NOTE! This parameter IS required when org_page_content_id IS NOT provided)
        required: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - enroll_coverage
          - enroll_pcp
          - enroll_confirm_email
          - enroll_confirm
          - enroll_beneficiary
          - enroll_benefits
          - enroll_dependents
          - enroll_dependents/new
          - enroll_personal
          - enroll_personal_view
          - enroll_dependents/edit
          - sub_main/initial
          - sub_main/confirm
          - sub_main/open
          - sub_main/life_event
          - sub_main/dual
          - sub_main/new_message
          - dashboard/initial
          - dashboard
          - dashboard/open
          - dashboard/dual
          - dashboard/life_event
      - name: org_plan_year_id
        in: query
        description: Unique id for the associated plan year
        required: true
        schema:
          type: integer
          format: int32
      - name: enrollment_type
        in: query
        description: Enrollment lookup code (NOTE! This parameter IS required when page_content_lookup_code IS EQUAL sub_main)
        required: false
        schema:
          type: string
          enum:
          - open
          - initial
          - life_event
          - dual
      - name: benefit_lookup_code
        in: query
        description: Benefit lookup code
        required: false
        schema:
          type: string
          enum:
          - 401k
          - 401k_catch_up
          - 401k_roth
          - 401k_roth_catch_up
          - accident_advance_coverage
          - add
          - add_dep_only
          - add_spouse_only
          - admin_fee
          - aflac_accidtental
          - aflac_critical_ill_ee
          - aflac_critical_ill_ee_buyup
          - aflac_critical_ill_sp
          - aflac_critical_ill_sp_buyup
          - aflac_hospital
          - aflac_std
          - aflac_whole_life
          - aflac_whole_life_ch
          - aflac_whole_life_sp
          - agreement_1
          - agreement_2
          - agreement_3
          - allstate_accident
          - allstate_accidental
          - allstate_cancer
          - allstate_cancer2
          - allstate_critical_illness
          - allstate_critical_illness1
          - allstate_critical_ill_ee
          - allstate_critical_ill_sp
          - allstate_disability
          - allstate_grp_accident
