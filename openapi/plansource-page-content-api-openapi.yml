components:
  schemas:
    NoLinks500Error:
      title: Error
      required:
      - error_code
      - http_status
      - message
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    PageContentData:
      title: PageContentData
      type: object
      properties:
        id:
          type: integer
          description: Page content ID.
          format: int32
        page_title:
          type: string
          description: Page title.
        page_subtitle:
          type: string
          description: Page subtitle.
        page_text:
          type: string
          description: Page body text.
        view:
          type: string
          description: Page view.
        org_plan_year_id:
          type: integer
          description: Assigned plan year ID.
          format: int32
        org_population_id:
          type: integer
          description: Assigned population ID.
          format: int32
        benefit:
          type: string
          description: Benefit name.
        locale:
          type: string
          description: Assigned localization.
        content_blocks:
          type: array
          description: Array of content block objects.
          items:
            $ref: '#/components/schemas/ContentBlock'
    403Error:
      title: Error
      type: object
      properties:
        status:
          type: string
        errors:
          type: array
          items: {}
        http_status:
          type: integer
        message:
          type: string
        details:
          type: string
        error_code:
          type: string
        data:
          type: array
          items: {}
    ContentBlockWithId:
      title: Content Block With Id
      type: object
      properties:
        slot_num:
          type: integer
          description: Display order of content blocks.
          format: int32
        block_type:
          type: string
          description: 'Type of content block. Options: content | rotating | marketplace | documents'
        label:
          type: string
          description: Content block label.
        label_action:
          type: string
          description: 'Action to be taken when label is clicked (If set.) Options: popup_content | navigate | new_window | popup_url'
        css_class:
          type: string
          description: CSS class to use for content block container.
        url:
          type: string
          description: URL to navigate to or open in popup when label is clicked.
        icon_img:
          type: string
          description: Base64 encoded image to use as a background icon in this block.
        popup:
          $ref: '#/components/schemas/Popup'
        html_content:
          type: string
          description: HTML-formatted content block.
        content:
          type: string
          description: Non-HTML-formatted content used for this block.
        rotating_content:
          type: array
          description: List of rotating content blocks. Only available when block type is rotating.
          items:
            type: object
        marketplace:
          $ref: '#/components/schemas/Marketplace'
        documents:
          type: array
          description: List of documents. Only available when block type is documents.
          items:
            $ref: '#/components/schemas/Document156'
        id:
          type: integer
          description: Id of content block.
          format: int32
    ContentBlock:
      title: ContentBlock
      type: object
      properties:
        id:
          type: integer
          description: P!ontent block ID.
          format: int32
        slot_num:
          type: integer
          description: Display order of content blocks.
          format: int32
        block_type:
          type: string
          description: 'Type of content block. Options: content | rotating | marketplace | documents'
        label:
          type: string
          description: Content block label.
        label_action:
          type: string
          description: 'Action to be taken when label is clicked (If set.) Options: popup_content | navigate | new_window | popup_url'
        css_class:
          type: string
          description: CSS class to use for content block container.
        url:
          type: string
          description: URL to navigate to or open in popup when label is clicked.
        icon_img:
          type: string
          description: Base64 encoded image to use as a background icon in this block.
        popup:
          $ref: '#/components/schemas/Popup'
        html_content:
          type: string
          description: HTML-formatted content block.
        content:
          type: string
          description: Non-HTML-formatted content used for this block.
