      - name: SAMLResponse
        in: header
        description: When using SAML SSO, the content of the SAML assertion.
        required: false
        schema:
          type: string
      - name: RelayState
        in: header
        description: When using SAML SSO, the URI to redirect the client to if authentication is successful.
        required: false
        schema:
          type: string
      - name: Cookie
        in: header
        description: Session cookie.  A string following the standard HTTP Cookie standard (RFC 6265).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Page content(s) retrieval response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentResponse'
              examples:
                response:
                  value:
                    status: success
                    errors: []
                    data: []
        '400':
          description: Malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 400
                      message: Not enough or too many segments
                    data: []
        '401':
          description: Invalid token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 401
                      message: Signature has expired
                      error_code: invalid_token
                    data: []
        '403':
          description: Access error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 403
                      message: Forbidden
                    data: []
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 404
                      message: Requested route 'page_conten' not found
                      error_code: route_not_found
        '500':
          description: InternalServerError
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoLinks500Error'
              examples:
                response:
                  value:
                    status: failure
                    errors:
                      http_status: 500
                      message: Internal error
                    data: []
    put:
      tags:
      - Page Content
      description: Applies any changes to page content and content block records.
      parameters:
      - name: Accept
        in: header
        description: The format of content that is acceptable as a response.
        required: false
        schema:
          type: string
          enum:
          - application/json
      - name: Content-Type
        in: header
        description: The format of content in the request.
        required: false
        schema:
          type: string
          enum:
          - application/json
      - name: org_page_content_id
        in: query
        description: Unique id for the org page content.
        required: true
        schema:
          type: integer
          format: int32
      - name: org_plan_year_id
        in: query
        description: Unique id for the associated plan year
        required: true
        schema:
          type: integer
          format: int32
      - name: SAMLResponse
        in: header
        description: When using SAML SSO, the content of the SAML assertion.
        required: false
        schema:
          type: string
      - name: RelayState
        in: header
